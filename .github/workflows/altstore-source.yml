name: AltStore source

# Keeps altstore.json in step with the newest release, so a phone that has this
# source added sees the update on its own - no cable, no PC, no Actions login.
#
# Separate from ios.yml on purpose: this is a 20-second Linux job reacting to a
# release, not part of building one.

# NOT triggered by `release: published`. GitHub deliberately refuses to start a
# workflow from an event raised by GITHUB_TOKEN (its loop guard), and our releases
# are created by ios.yml using exactly that token - so a release trigger here
# would simply never fire. ios.yml calls this instead, and workflow_dispatch stays
# available for repairing a manifest by hand.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to point the manifest at'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to point the manifest at (default: the latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a release event checks out the tag; we must commit to main
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          # The version AltStore compares against is the tag without a leading v.
          VERSION="${TAG#v}"
          SIZE=$(gh release view "$TAG" --json assets \
                 --jq '.assets[] | select(.name == "TyraXCam.ipa") | .size')
          if [ -z "$SIZE" ]; then
            echo "::error::release $TAG has no TyraXCam.ipa asset - did the iOS build finish?"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
          DATE=$(gh release view "$TAG" --json publishedAt --jq '.publishedAt')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Regenerate altstore.json
        run: |
          node scripts/altstore-source.mjs \
            '${{ steps.rel.outputs.version }}' \
            '${{ steps.rel.outputs.size }}' \
            '${{ steps.rel.outputs.date }}'
          node -e 'JSON.parse(require("fs").readFileSync("altstore.json"))' # must be valid JSON
          cat altstore.json

      - name: Commit it
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore.json; then
            echo "altstore.json already current - nothing to do"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add altstore.json
          # ios.yml ignores altstore.json, so this cannot loop - the skip marker
          # is belt and braces.
          git commit -m "AltStore source: ${{ steps.rel.outputs.tag }} [skip ci]"
          git push
